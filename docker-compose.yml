# Linux and GitHub Codespaces. Host networking lets the gate reach preview
# containers that publish on 127.0.0.1. Render does not use this file.
services:
  # The only service that holds the Docker socket. Mayfly talks to Docker through this proxy, which allows
  # containers, images and builds and refuses exec, volumes, networks, swarm, secrets, system and plugins.
  # It filters by endpoint, not by request body, so it cannot stop a container created with --privileged.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:2375:2375"
    environment:
      POST: 1
      CONTAINERS: 1
      IMAGES: 1
      BUILD: 1
      EXEC: 0
      VOLUMES: 0
      NETWORKS: 0
      SERVICES: 0
      SWARM: 0
      SECRETS: 0
      CONFIGS: 0
      SYSTEM: 0
      PLUGINS: 0
      SESSION: 0
      GRPC: 0
      AUTH: 0
      COMMIT: 0
      INFO: 0
      NODES: 0
      TASKS: 0
      DISTRIBUTION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  mayfly:
    build: .
    network_mode: host
    depends_on:
      - docker-proxy
    env_file:
      - path: .env.local
        required: false
    # PREVIEW_REPOS (the repositories whose pull requests are built) and the PREVIEW_BUILD_* and
    # PREVIEW_MAX_* limits come from .env.local above.
    environment:
      PREVIEW_RUNTIME: docker
      DOCKER_HOST: tcp://127.0.0.1:2375
      PREVIEW_BASE_URL: ${PREVIEW_BASE_URL:-}
      CODESPACE_NAME: ${CODESPACE_NAME:-}
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: ${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN:-}
    volumes:
      - ./data:/app/data
